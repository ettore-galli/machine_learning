[project]
dependencies = [
  "langchain==1.3.15",
  "langchain-ollama==1.1.0",
  "langchain-openai==1.4.3",
  "python-dotenv==1.2.2",
]
description = "Lang Chain modulo 1"
name = "lc-1"
readme = "README.md"
requires-python = "==3.12.*"
